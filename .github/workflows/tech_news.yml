name: "🌍 科技外媒精读 (16:00)"

on:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 08:00 -> 北京时间下午 16:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.KEY }}"' >> .env
          echo 'Feishu_webhook="${{ secrets.FEISHU_WEBHOOK }}"' >> .env
          
      - name: Run 【外媒科技新闻】
        run: |
          python 外媒科技新闻.py