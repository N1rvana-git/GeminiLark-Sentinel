name: "📈 GitHub Trending AI周报 (每周一 13:30)"

on:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 05:30 -> 北京时间 13:30，1代表周一
    - cron: '30 5 * * 1'
  workflow_dispatch:

jobs:
  weekly-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bs4 # 确保爬虫库能被安装
          
      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.GEMINI_API_KEY }}"' >> .env
          echo 'Feishu_webhook="${{ secrets.FEISHU_WEBHOOK }}"' >> .env
          
      - name: Run 【GitHub周报】
        run: |
          python GitHub周报.py