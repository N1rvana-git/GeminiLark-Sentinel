name: "⚖️ 每日法律资讯 (14:00)"

on:
  schedule:
    # UTC 06:00 -> 北京时间下午 14:00 (每天)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.KEY }}"' >> .env
          echo 'Feishu_webhook_DYX="${{ secrets.FEISHU_WEBHOOK_DYX }}"' >> .env
          
      - name: Run 【每日法律资讯】
        run: |
          python 每日法律资讯.py
