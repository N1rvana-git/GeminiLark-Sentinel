name: "🔥 每日技术面试题 (15:00)"

on:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 07:00 -> 北京时间下午 15:00
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.GEMINI_API_KEY }}"' >> .env
          echo 'Feishu_webhook_JZP="${{ secrets.FEISHU_WEBHOOK_JZP }}"' >> .env
          
      - name: Run 【每日技术面试题】
        run: |
          python 每日技术面试题.py