name: "🔬 LLM论文速递 (每周二 11:00)"

on:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 03:00 -> 北京时间 11:00，2 代表周二
    - cron: '0 3 * * 2'
  workflow_dispatch:

jobs:
  weekly-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.GEMINI_API_KEY }}"' >> .env
          echo 'Feishu_webhook_JZP="${{ secrets.FEISHU_WEBHOOK_JZP }}"' >> .env
          
      - name: Run 【LLM论文速递】
        run: |
          python LLM论文速递.py