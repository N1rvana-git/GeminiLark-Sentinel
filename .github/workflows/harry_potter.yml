name: "🪄 哈利波特 (12:00)"

on:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 04:00 -> 北京时间中午 12:00 (每天)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Secrets
        run: |
          echo 'url="https://api.zetatechs.com"' >> .env
          echo 'key="${{ secrets.GEMINI_API_KEY }}"' >> .env
          echo 'Feishu_webhook_JZP="${{ secrets.FEISHU_WEBHOOK_JZP }}"' >> .env
          echo 'Feishu_webhook_DYX="${{ secrets.FEISHU_WEBHOOK_DYX }}"' >> .env
          echo 'Feishu_webhook_QUNCI="${{ secrets.FEISHU_WEBHOOK_QUNCI }}"' >> .env

      - name: Run 【哈利波特】
        run: |
          python 哈利波特.py